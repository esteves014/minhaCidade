<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A8CE8"/>
      <stop offset="0.5" stop-color="#1A5FB4"/>
      <stop offset="1" stop-color="#0C3573"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E6F7"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Anéis de radar de mapa -->
  <g fill="none" stroke="#FFFFFF">
    <circle cx="840" cy="230" r="170" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="840" cy="230" r="250" stroke-opacity="0.10" stroke-width="2"/>
    <circle cx="840" cy="230" r="340" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- Horizonte de prédios ao fundo (esquerda) -->
  <g fill="#0C3573" fill-opacity="0.35">
    <rect x="0" y="420" width="70" height="80"/>
    <rect x="80" y="390" width="55" height="110"/>
    <rect x="145" y="430" width="80" height="70"/>
    <rect x="235" y="400" width="50" height="100"/>
    <rect x="295" y="440" width="90" height="60"/>
  </g>

  <!-- Logo: alfinete com horizonte da cidade e sol (mesmas formas do ícone do app) -->
  <g transform="translate(610,-8) scale(4.5)">
    <ellipse cx="54" cy="89.5" rx="9" ry="2.2" fill="#000" fill-opacity="0.25"/>
    <path d="M54,88 C46,78 30,62 30,46 A24,24 0 0 1 78,46 C78,62 62,78 54,88 Z" fill="url(#pin)"/>
    <circle cx="42" cy="34.5" r="4.5" fill="#FFB300"/>
    <path d="M38,45h9v15h-9zM61,40h9v20h-9z" fill="#4C92E3"/>
    <path d="M47,30h14v30h-14zM53.2,24.5h1.6v5.5h-1.6z" fill="#1A5FB4"/>
    <path d="M37,60h34v1.8h-34z" fill="#0C3573"/>
    <path fill="#FFF" d="M49.6,33.5h2.6v2.6h-2.6zM55.8,33.5h2.6v2.6h-2.6zM49.6,39.5h2.6v2.6h-2.6zM55.8,39.5h2.6v2.6h-2.6zM49.6,45.5h2.6v2.6h-2.6zM55.8,45.5h2.6v2.6h-2.6zM41.2,48h2.6v2.6h-2.6zM41.2,53.5h2.6v2.6h-2.6zM64.2,43.5h2.6v2.6h-2.6zM64.2,49h2.6v2.6h-2.6zM64.2,54.5h2.6v2.6h-2.6z"/>
    <path d="M52.2,53h2.6v7h-2.6z" fill="#FFB300"/>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" fill="#FFFFFF">
    <text x="64" y="205" font-size="96" font-weight="800" letter-spacing="-2">minha<tspan fill="#FFB300">Cidade</tspan></text>
    <text x="68" y="262" font-size="32" font-weight="400" fill-opacity="0.92">Vagas, notícias e denúncias da sua cidade.</text>
  </g>

  <!-- Chips -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="middle">
    <rect x="68" y="304" width="132" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <text x="134" y="336" fill="#FFFFFF">Vagas</text>
    <rect x="214" y="304" width="156" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.18" stroke="#FFFFFF" stroke-opacity="0.45"/>
    <text x="292" y="336" fill="#FFFFFF">Notícias</text>
    <rect x="384" y="304" width="170" height="48" rx="24" fill="#FFB300"/>
    <text x="469" y="336" fill="#0C3573">Denúncias</text>
  </g>
</svg>
